# Prometheus scrape config për tre mikroshërbimet + infrastrukturën.
# Modeli i marrë nga infra/monitoring/prometheus.yml i platformës Fiks.
# Vendose në repo si infra/monitoring/prometheus.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'order-service'
    static_configs:
      - targets: ['order-service:8000']
    metrics_path: '/metrics'

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['inventory-service:8000']
    metrics_path: '/metrics'

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8000']
    metrics_path: '/metrics'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    metrics_path: '/metrics'

  - job_name: 'postgres-orders'
    static_configs:
      - targets: ['postgres-orders:5432']

  - job_name: 'postgres-inventory'
    static_configs:
      - targets: ['postgres-inventory:5432']
