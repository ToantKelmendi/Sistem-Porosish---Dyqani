# API Gateway L7 për Sistem Procesimi Porosish.
# Modeli i marrë nga infra/nginx/nginx.conf i platformës Fiks: një pikë e vetme
# hyrjeje, rate limiting për IP, dhe ruterim sipas përmbajtjes së rrugës.
# Vendose në repo si infra/nginx/nginx.conf dhe shtoje si shërbim në docker-compose.

events {
    worker_connections 1024;
}

http {
    # Zonat e rate limiting: API e përgjithshme 10 kërkesa/s, shkrimet 5 kërkesa/s
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=write_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream order_service {
        server order-service:8000;
    }

    upstream inventory_service {
        server inventory-service:8000;
    }

    upstream notification_service {
        server notification-service:8000;
    }

    server {
        listen 80;
        server_name localhost;
        limit_conn conn_limit 20;

        # Shkrimet e porosive — kufi më i shtrënguar
        location = /api/orders {
            limit_req zone=write_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://order_service/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /api/orders/ {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/orders/(.*)$ /orders/$1 break;
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        location /api/products {
            limit_req zone=api_limit burst=30 nodelay;
            rewrite ^/api/products(.*)$ /products$1 break;
            proxy_pass http://inventory_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-API-Key $http_x_api_key;
        }

        # Metrikat mbeten të brendshme — nuk kalojnë nga gateway-i publik
        location /metrics {
            deny all;
            return 403;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
