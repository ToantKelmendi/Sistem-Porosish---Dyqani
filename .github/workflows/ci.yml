# CI: çdo push dhe pull request kalon nga lint, teste dhe ndërtim imazhesh.
# Asnjë kredencial në skedar — API_KEY-i i testeve është vlerë e njohur, jo sekret.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint dhe teste — order-service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalo varësitë
        working-directory: order-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Kontroll stili (ruff)
        working-directory: order-service
        run: ruff check app tests

      - name: Ekzekuto testet
        working-directory: order-service
        run: pytest

  build-images:
    name: Ndërtimi i imazheve
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        service: [order-service, inventory-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Ndërto ${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

  compose-smoke:
    name: Provë ngritjeje me Docker Compose
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - uses: actions/checkout@v4

      - name: Krijo .env për provën
        run: |
          cp .env.example .env
          sed -i 's/^ORDERS_DB_PASSWORD=/ORDERS_DB_PASSWORD=ci_pass/' .env
          sed -i 's/^INVENTORY_DB_PASSWORD=/INVENTORY_DB_PASSWORD=ci_pass/' .env
          sed -i 's/^RABBITMQ_PASSWORD=/RABBITMQ_PASSWORD=ci_pass/' .env
          sed -i 's/^API_KEY=/API_KEY=ci_test_key/' .env

      - name: Ngrit sistemin
        run: docker compose up -d --build

      - name: Prit dhe verifiko /health
        run: |
          sleep 45
          curl --fail http://localhost:8001/health
          curl --fail http://localhost:8002/health
          curl --fail http://localhost:8003/health

      - name: Logs në rast dështimi
        if: failure()
        run: docker compose logs

      - name: Pastro
        if: always()
        run: docker compose down -v
