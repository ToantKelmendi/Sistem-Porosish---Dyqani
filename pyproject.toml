# Konfigurimi i veglave të cilësisë. Një skedar për të gjitha shërbimet, që
# stili të mos ndryshojë nga njëri te tjetri.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E: gabime pycodestyle, F: pyflakes, I: rendi i importeve, B: bugbear,
# UP: modernizim sintakse, N: konventat e emërtimit.
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
